    position: relative;
    min-height: 70vh;
    overflow: hidden;
    isolation: isolate;
    background: #000;
  }

  /* Stage = the layer that gets wiped in from the left on scroll */
  .light-stage {
    position: absolute;
    inset: 0;
    z-index: 0;
    --reveal: -45%;
    -webkit-mask-image: linear-gradient(90deg, #000 var(--reveal), transparent calc(var(--reveal) + 45%));
            mask-image: linear-gradient(90deg, #000 var(--reveal), transparent calc(var(--reveal) + 45%));
    transition: --reveal 2.4s cubic-bezier(.22, .7, .2, 1);
  }
  .light-section.is-in .light-stage { --reveal: 100%; }

  /* Same picture used twice. Identical geometry, so at rest you can't tell. */
  .light-img {
    position: absolute;
    inset: -16% -6%;               /* bleed so the moving copy never shows an edge */
    background: var(--light-art) left center / cover no-repeat;
  }

  /* Only the area around the light is allowed to move.
     This wrapper is fixed and feathered, so the section edges and the
     purple field on the right stay perfectly still. */
  .light-move {
    position: absolute;
    inset: 0;
    -webkit-mask-image: radial-gradient(ellipse 58% 60% at 0% 50%, #000 42%, transparent 100%);
            mask-image: radial-gradient(ellipse 58% 60% at 0% 50%, #000 42%, transparent 100%);
  }
  .light-move .light-img {
    transform-origin: 0% 50%;      /* pivot on the light source */
    will-change: transform;
  }

  /* Your content sits above the light */
  .light-content {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin-left: auto;
    padding: 18vh 6vw;
  }
  .light-content h2 { font-size: clamp(28px, 4vw, 48px); margin: 0 0 12px; }
  .light-content p  { color: #c9c3e6; line-height: 1.6; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .light-stage { transition: none; }
  }
</style>
</head>
<body>

<div class="spacer">scroll down</div>

<section class="light-section" data-light-section>
  <div class="light-stage" aria-hidden="true">
    <div class="light-img"></div>                       <!-- static base -->
    <div class="light-move"><div class="light-img"></div></div>  <!-- the light that moves -->
  </div>

  <div class="light-content">
    <h2>Section headline goes here</h2>
    <p>Swap this block for your real content. The light sits behind it.</p>
  </div>
</section>

<div class="spacer">more page</div>

<script>
(() => {
  const section = document.querySelector("[data-light-section]");
  if (!section) return;

  const mover = section.querySelector(".light-move .light-img");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* 1. Scroll-in: light leaks in from the left once the section is in view */
  const io = new IntersectionObserver(([entry]) => {
    if (entry.isIntersecting) {
      section.classList.add("is-in");
      io.disconnect();
    }
  }, { threshold: 0.35 });
  io.observe(section);

  if (reduce) { section.classList.add("is-in"); return; }

  /* 2. Hover: nudge the light toward the cursor. Tweak these to taste. */
  const CFG = {
    shift:   22,    // max drift in px
    tilt:    2,     // max beam rotation in degrees
    stretch: 0.04,  // beam lengthens/shortens up to 4%
    ease:    0.07   // lower = floatier
  };

  const target = { x: 0, y: 0 };
  const cur    = { x: 0, y: 0 };
  let raf = 0;

  const start = () => { if (!raf) raf = requestAnimationFrame(tick); };

  function tick() {
    cur.x += (target.x - cur.x) * CFG.ease;
    cur.y += (target.y - cur.y) * CFG.ease;

    mover.style.transform =
      `translate3d(${cur.x * CFG.shift}px, ${cur.y * CFG.shift * 0.7}px, 0) ` +
      `rotate(${cur.y * CFG.tilt}deg) scaleX(${1 + cur.x * CFG.stretch})`;

    const settled = Math.abs(target.x - cur.x) < 0.001 && Math.abs(target.y - cur.y) < 0.001;
    raf = settled ? 0 : requestAnimationFrame(tick);
  }

  section.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") return;
    const r = section.getBoundingClientRect();
    target.x = ((e.clientX - r.left) / r.width)  * 2 - 1;   // -1 (left) to 1 (right)
    target.y = ((e.clientY - r.top)  / r.height) * 2 - 1;   // -1 (top) to 1 (bottom)
    start();
  });

  section.addEventListener("pointerleave", () => {
    target.x = target.y = 0;
    start();
  });
})();
</script>
</body>
</html>
