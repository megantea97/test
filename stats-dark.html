<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats Dark</title>
<meta name="description" content="54% of gig workers need funds the same day they are processed. 48% of freelancers and contractors need earnings the same day. 36% of gig platforms offer instant payouts always or most of the time.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">

<style>
  :root {
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Playfair Display", "Times New Roman", serif;
    --num: #9176f9;                 /* the purple of the big numbers */
    --ink: #ffffff;                 /* label text */
    --rule: rgba(255,255,255,.3);   /* the vertical dividers */
    --muted: #8d8999;               /* source line */
    --p: 1.3em;                     /* height of one digit slot (a little tall so old-style digits never get clipped) */
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: transparent; }
  body {
    margin: 0;
    padding: 0;
    font-family: var(--sans);
    color: var(--ink);
    background: transparent;        /* nothing behind it: it sits on whatever section you place it in */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ---------- The island ---------- */
  .stats {
    --n: clamp(46px, 5.9vw, 96px);      /* size of the big numbers */
    width: 100%;
    padding: 16px 0 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .row {
    width: min(100%, 1212px);
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: stretch;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 clamp(8px, 1.6vw, 28px);
  }

  .num {
    display: flex;
    align-items: baseline;
    justify-content: center;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: var(--n);
    line-height: var(--p);
    color: var(--num);
    white-space: pre;
    letter-spacing: 0;
  }
  .pc {
    align-self: flex-start;
    margin: .3em 0 0 .06em;
    font-size: .62em;
    line-height: 1;
    font-weight: 400;
  }
  .label {
    max-width: 24em;
    margin: calc(var(--n) * .155) 0 0;
    font-size: clamp(13px, 1.1vw, 17px);
    line-height: 1.6;
    color: var(--ink);
  }

  .rule {
    flex: none;
    width: 1px;
    align-self: stretch;
    margin: calc(var(--n) * .04) 0 0;
    background: var(--rule);
    transform: scaleY(0);
    transform-origin: 50% 0;
    transition: transform 1.1s cubic-bezier(.2,.7,.2,1) .35s;
  }
  .go .rule, .no-js .rule { transform: scaleY(1); }

  .src {
    margin: clamp(30px, 5.2vw, 72px) 0 0;
    padding: 0 16px;
    text-align: center;
    font-size: clamp(11px, .96vw, 14px);
    line-height: 1.5;
    color: var(--muted);
  }

  /* ---------- Rolling digits ---------- */
  .d {
    position: relative;
    display: inline-block;
    height: var(--p);
    clip-path: inset(0 -0.4em);                /* clips the top and bottom to the window, lets digits overhang the sides */
  }
  .d .sz { visibility: hidden; display: block; height: var(--p); }          /* gives the column the width of its final digit */
  .d .tape {
    position: absolute; left: 50%; top: 0;
    display: flex; flex-direction: column; align-items: center;
    transform: translate3d(-50%, calc(var(--i, 0) * var(--p) * -1), 0);
    transition-property: transform;
    transition-timing-function: cubic-bezier(.16, .84, .24, 1);        /* quick start, long soft landing */
    will-change: transform;
  }
  .d .tape b { display: block; height: var(--p); font-weight: inherit; }
  .go .d .tape { --i: var(--end); }

  /* things that arrive once the numbers are on their way */
  .fade { opacity: 0; transform: translate3d(0, 10px, 0); transition: opacity .9s ease var(--fd, .6s), transform .9s cubic-bezier(.2,.7,.2,1) var(--fd, .6s); }
  .go .fade, .no-js .fade { opacity: 1; transform: none; }
  .no-js .d .tape { display: none; }
  .no-js .d .sz { visibility: visible; }

  .rw, .rw * { transition: none !important; }   /* used while rewinding so it can roll again */

  /* ---------- Narrow screens: stack them ---------- */
  @media (max-width: 760px) {
    .stats { --n: clamp(60px, 18vw, 76px); }
    .row { grid-template-columns: 1fr; row-gap: 26px; }
    .stat { padding: 0 8px; }
    .label { font-size: 15px; max-width: 17em; }
    .br { display: none; }
    .rule { width: min(70%, 260px); height: 1px; align-self: center; justify-self: center; margin: 0; transform: scaleX(0); transform-origin: 50% 50%; }
    .go .rule, .no-js .rule { transform: scaleX(1); }
    .src { margin-top: 34px; font-size: 12.5px; text-wrap: balance; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rule, .fade, .d .tape { transition: none !important; }
  }
</style>
</head>

<body>
<section class="stats" id="stats" aria-label="Key numbers">

  <div class="row">

    <div class="stat">
      <div class="num"><span data-roll="54">54</span><span class="pc fade" style="--fd:1.0s">%</span></div>
      <p class="label fade" style="--fd:.5s">of gig workers need funds the same<br class="br"> day they are processed</p>
    </div>

    <span class="rule" aria-hidden="true"></span>

    <div class="stat">
      <div class="num"><span data-roll="48">48</span><span class="pc fade" style="--fd:1.2s">%</span></div>
      <p class="label fade" style="--fd:.7s">of freelancers and contractors need<br class="br"> earnings the same day</p>
    </div>

    <span class="rule" aria-hidden="true"></span>

    <div class="stat">
      <div class="num"><span data-roll="36">36</span><span class="pc fade" style="--fd:1.4s">%</span></div>
      <p class="label fade" style="--fd:.9s">of gig platforms offer instant<br class="br"> payouts always or most of the time</p>
    </div>

  </div>

  <p class="src fade" style="--fd:1.5s">Source: PYMNTS Intelligence, Money Mobility Ecosystem, 2025</p>

</section>

<script>
(function () {
  "use strict";

  /* ============================================================
     TWEAK THESE
     ============================================================ */
  var CONFIG = {
    duration: 2000,      // ms. How long each digit takes to roll to its number.
    digitStagger: 140,   // ms between the digits of one number (left to right).
    itemStagger: 240,    // ms between the three numbers.
    spins: 1,            // extra full turns of 0 to 9 before landing (0 = rolls straight there, 2 = spins more).
    startAt: 0.45,       // how much of the island must be on screen before it starts (0 to 1).
    replay: true         // true = rolls again if it scrolls away and comes back.
  };

  var root = document.documentElement;
  var panel = document.getElementById("stats");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!("IntersectionObserver" in window) || reduce) { root.className += " no-js"; return; }

  /* ---------- turn each number into columns of rolling digits ---------- */
  var items = Array.prototype.slice.call(panel.querySelectorAll(".stat"));
  items.forEach(function (stat, si) {
    var order = 0;
    Array.prototype.forEach.call(stat.querySelectorAll("[data-roll]"), function (holder) {
      var text = holder.getAttribute("data-roll");
      holder.textContent = "";
      holder.style.display = "inline-flex";
      text.split("").forEach(function (ch) {
        var n = parseInt(ch, 10);
        var col = document.createElement("span");
        col.className = "d";
        var sz = document.createElement("span"); sz.className = "sz"; sz.textContent = ch; col.appendChild(sz);

        var tape = document.createElement("span"); tape.className = "tape";
        var turns = CONFIG.spins + 1;
        for (var t = 0; t <= turns; t++) for (var k = 0; k < 10; k++) { var b = document.createElement("b"); b.textContent = k; tape.appendChild(b); }
        var end = CONFIG.spins * 10 + n + (n === 0 ? 10 : 0);     // always travels at least one full turn, so even a 0 visibly rolls
        tape.style.setProperty("--end", end);
        tape.style.transitionDuration = CONFIG.duration + "ms";
        tape.style.transitionDelay = (si * CONFIG.itemStagger + order * CONFIG.digitStagger + 150) + "ms";
        col.appendChild(tape);
        holder.appendChild(col);
        order++;
      });
    });
  });

  /* ---------- go when it's on screen ---------- */
  new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.intersectionRatio >= CONFIG.startAt) root.classList.add("go");
      else if (CONFIG.replay && e.intersectionRatio === 0) {
        // rewind with no animation so it can roll again next time
        panel.classList.add("rw");
        root.classList.remove("go");
        void panel.offsetWidth;
        panel.classList.remove("rw");
      }
    });
  }, { threshold: [0, CONFIG.startAt] }).observe(panel);

})();
</script>
</body>
</html>
